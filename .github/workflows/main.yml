name: CI and Deploy to A2

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check server.js && node --check env.js && node --check db.js

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://example.com' }}
        run: npm run build

  deploy:
    name: Deploy & start backend on A2
    needs: [backend, frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Required: your secrets live under Settings → Environments → Prod
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install & build frontend (production API URL)
        working-directory: frontend
        env:
          # Prefer Actions secret; also accept Actions variable (common mix-up).
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          VITE_SESSION_IDLE_MINUTES: ${{ vars.VITE_SESSION_IDLE_MINUTES || '30' }}
          VITE_SESSION_MAX_HOURS: ${{ vars.VITE_SESSION_MAX_HOURS || '8' }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_URL:-}" ]; then
            echo "::error::VITE_API_URL is empty."
            echo "Add it under Settings → Secrets and variables → Actions → Secrets"
            echo "Name must be exactly: VITE_API_URL"
            echo "Value example: https://marketing.legatolxp.online"
            echo "Do NOT put it only under Environment secrets unless this job uses that environment."
            exit 1
          fi
          echo "Building frontend with VITE_API_URL set (length=${#VITE_API_URL})"
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          A2_SSH_KEY: ${{ secrets.A2_SSH_KEY }}
          A2_SSH_KNOWN_HOSTS: ${{ secrets.A2_SSH_KNOWN_HOSTS }}
          A2_SSH_HOST: ${{ secrets.A2_SSH_HOST }}
          A2_SSH_PORT: ${{ secrets.A2_SSH_PORT }}
        run: |
          set -euo pipefail
          for v in A2_SSH_KEY A2_SSH_HOST; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done
          PORT="${A2_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Normalize private key from GitHub secret (CRLF / literal \n / wrapping quotes)
          KEY_FILE="$HOME/.ssh/a2_deploy_key"
          python3 - <<'PY'
          import os, pathlib
          raw = os.environ["A2_SSH_KEY"].strip()
          if (raw.startswith('"') and raw.endswith('"')) or (raw.startswith("'") and raw.endswith("'")):
              raw = raw[1:-1]
          raw = raw.replace("\r\n", "\n").replace("\r", "\n")
          if "\\n" in raw and "-----BEGIN" in raw and "\n-----" not in raw.replace("\\n", ""):
              # secret stored as one line with literal \n
              raw = raw.replace("\\n", "\n")
          if not raw.endswith("\n"):
              raw += "\n"
          path = pathlib.Path.home() / ".ssh" / "a2_deploy_key"
          path.write_text(raw, encoding="utf-8")
          path.chmod(0o600)
          if "PRIVATE KEY" not in raw:
              raise SystemExit("A2_SSH_KEY must be the PRIVATE key (contains PRIVATE KEY), not .pub")
          print(f"Wrote deploy key ({len(raw)} bytes, begins with: {raw.splitlines()[0]})")
          PY

          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::A2_SSH_KEY is not a valid private key (libcrypto / parse failed)."
            echo "On the server run: cat ~/.ssh/marketing"
            echo "Paste the FULL private key into Environment secret A2_SSH_KEY (Prod)."
            echo "Must start with -----BEGIN ... PRIVATE KEY----- and end with -----END ... PRIVATE KEY-----"
            echo "Use an empty passphrase key. Do not paste marketing.pub"
            exit 1
          fi

          if [ -n "${A2_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$A2_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$A2_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload backend + frontend to A2
        env:
          A2_SSH_HOST: ${{ secrets.A2_SSH_HOST }}
          A2_SSH_USER: ${{ secrets.A2_SSH_USER }}
          A2_SSH_PORT: ${{ secrets.A2_SSH_PORT }}
          A2_BACKEND_PATH: ${{ secrets.A2_BACKEND_PATH }}
          A2_FRONTEND_PATH: ${{ secrets.A2_FRONTEND_PATH }}
        run: |
          set -euo pipefail
          PORT="${A2_SSH_PORT:-22}"
          SSH=(ssh -i ~/.ssh/a2_deploy_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          RSYNC_SSH="ssh -i ~/.ssh/a2_deploy_key -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          for v in A2_SSH_USER A2_BACKEND_PATH A2_FRONTEND_PATH; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done

          "${SSH[@]}" "$A2_SSH_USER@$A2_SSH_HOST" \
            "mkdir -p '$A2_BACKEND_PATH' '$A2_FRONTEND_PATH' '$A2_BACKEND_PATH/uploads/cards' '$A2_BACKEND_PATH/tmp'"

          # Backend code (keeps remote .env + uploads)
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            --exclude node_modules \
            --exclude .env \
            --exclude uploads \
            --exclude '*.log' \
            --exclude .git \
            ./backend/ "$A2_SSH_USER@$A2_SSH_HOST:$A2_BACKEND_PATH/"

          # Frontend static build
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            ./frontend/dist/ "$A2_SSH_USER@$A2_SSH_HOST:$A2_FRONTEND_PATH/"

      - name: Install deps and start/restart backend on A2
        env:
          A2_SSH_HOST: ${{ secrets.A2_SSH_HOST }}
          A2_SSH_USER: ${{ secrets.A2_SSH_USER }}
          A2_SSH_PORT: ${{ secrets.A2_SSH_PORT }}
          A2_BACKEND_PATH: ${{ secrets.A2_BACKEND_PATH }}
          A2_NODEVENV_ACTIVATE: ${{ secrets.A2_NODEVENV_ACTIVATE }}
          A2_RESTART_CMD: ${{ secrets.A2_RESTART_CMD }}
          A2_APP_ROOT: ${{ secrets.A2_APP_ROOT }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          PORT="${A2_SSH_PORT:-22}"
          SSH=(ssh -i ~/.ssh/a2_deploy_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          "${SSH[@]}" "$A2_SSH_USER@$A2_SSH_HOST" \
            env \
            A2_BACKEND_PATH="$A2_BACKEND_PATH" \
            A2_NODEVENV_ACTIVATE="${A2_NODEVENV_ACTIVATE:-}" \
            A2_RESTART_CMD="${A2_RESTART_CMD:-}" \
            A2_APP_ROOT="${A2_APP_ROOT:-}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$A2_BACKEND_PATH"

          if [ -n "${A2_NODEVENV_ACTIVATE:-}" ]; then
            # shellcheck disable=SC1090
            source "$A2_NODEVENV_ACTIVATE"
          fi

          if [ ! -f .env ]; then
            echo "::error::Missing $A2_BACKEND_PATH/.env on the server — create it once before the API can run."
            exit 1
          fi

          echo "==> npm install (production)"
          npm install --omit=dev

          mkdir -p uploads/cards tmp

          echo "==> Start / restart Node app"
          if [ -n "${A2_RESTART_CMD:-}" ]; then
            eval "$A2_RESTART_CMD"
          elif command -v cloudlinux-selector >/dev/null 2>&1 && [ -n "${A2_APP_ROOT:-}" ]; then
            # cPanel Setup Node.js App (CloudLinux)
            cloudlinux-selector restart --json --interpreter nodejs --app-root "$A2_APP_ROOT" || true
            touch tmp/restart.txt
          else
            # Passenger / Setup Node.js App default
            touch tmp/restart.txt
          fi

          # Prefer cPanel passenger restart file; also try starting if selector start exists
          if command -v cloudlinux-selector >/dev/null 2>&1 && [ -n "${A2_APP_ROOT:-}" ]; then
            cloudlinux-selector start --json --interpreter nodejs --app-root "$A2_APP_ROOT" || true
          fi

          echo "==> Backend path: $A2_BACKEND_PATH"
          echo "Deploy + restart finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REMOTE

          if [ -n "${VITE_API_URL:-}" ]; then
            echo "==> Health check"
            sleep 3
            curl -fsS --max-time 20 "${VITE_API_URL%/}/api/health" || curl -fsS --max-time 20 "${VITE_API_URL%/}/health" || echo "Health endpoint not reachable yet — check Node.js App is Running in cPanel."
          fi
